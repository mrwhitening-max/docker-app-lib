services:
  forgejo:
    image: ${FORGEJO_IMAGE:-codeberg.org/forgejo/forgejo:15}
    container_name: ${FORGEJO_CONTAINER_NAME:-forgejo}
    restart: always
    environment:
      # --- Benutzer im Container (muss zum Besitzer von DATA_PATH passen) ---
      - USER_UID=${USER_UID:-1000}
      - USER_GID=${USER_GID:-1000}

      # --- Allgemein ---
      - FORGEJO____APP_NAME=${APP_NAME:-Forgejo}

      # --- Server / URLs ---
      - FORGEJO__server__DOMAIN=${FORGEJO_HOST}
      - FORGEJO__server__ROOT_URL=http://${FORGEJO_HOST}:${HTTP_EXPOSE_PORT:-3000}/
      - FORGEJO__server__HTTP_PORT=3000
      - FORGEJO__server__SSH_DOMAIN=${FORGEJO_HOST}
      # Port, der in den Clone-URLs angezeigt wird (= Host-Port)
      - FORGEJO__server__SSH_PORT=${SSH_EXPOSE_PORT:-222}

      # --- Datenbank (SQLite) ---
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__database__PATH=/data/gitea/gitea.db

      # --- Sicherheit ---
      - FORGEJO__security__SECRET_KEY=${SECRET_KEY}
      - FORGEJO__security__INTERNAL_TOKEN=${INTERNAL_TOKEN}
      # Schutz für v15: Standard ist sonst "*"
      - FORGEJO__security__REVERSE_PROXY_TRUSTED_PROXIES=127.0.0.0/8,::1/128

      # --- Dienst ---
      - FORGEJO__service__DISABLE_REGISTRATION=${DISABLE_REGISTRATION:-true}
      - FORGEJO__service__REQUIRE_SIGNIN_VIEW=${REQUIRE_SIGNIN_VIEW:-true}

      # --- Mail ---
      - FORGEJO__mailer__ENABLED=${MAILER_ENABLED:-false}
    volumes:
      - ${DATA_PATH:-./forgejo}:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      # Web-Oberfläche
      - "${HTTP_EXPOSE_PORT:-3000}:3000"
      # Git über SSH (OpenSSH im Container lauscht auf 22)
      - "${SSH_EXPOSE_PORT:-222}:22"
