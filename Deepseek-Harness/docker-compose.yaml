name: dsh

services:

  dsh:
    image: runzhliu/deepseek-harness:${DSH_IMAGE_VERSION:-0.1.5-rc.2-r1}
    container_name: dsh
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 30s
    entrypoint:
      - /usr/bin/tini
      - --
      - sh
      - -c
      - |
        HOSTS="$$(node -p "Object.values(require('os').networkInterfaces()).flat().filter(i=>i.family==='IPv4').map(i=>i.address+':3080').join(' ')") $$(hostname):3080 localhost:3080"
        for h in ${DSH_HOSTNAME:-}; do HOSTS="$$HOSTS $$h $$h:3080"; done
        echo "dsh trusted hosts: $$HOSTS"
        node -e '
        const fs=require("fs");
        const base=fs.readFileSync("/opt/deepseek-harness/web.cordis.patch.yml","utf8");
        const url=(process.env.LITELLM_URL||"").trim().replace(/\/+$$/,"");
        (async()=>{
          let extra="";
          if(url){
            try{
              const r=await fetch(url+"/models",{headers:{Authorization:"Bearer "+(process.env.LITELLM_API_KEY||"")},signal:AbortSignal.timeout(10000)});
              if(!r.ok) throw new Error("HTTP "+r.status);
              const j=await r.json();
              const models=(j.data||[]).map(m=>({id:String(m.id||"")})).filter(m=>m.id);
              if(!models.length) throw new Error("keine Modelle gemeldet");
              const entry={id:"llm-pi-ai",name:"@deepseek-ai/dsh-llm-pi-ai",config:{providers:{litellm:{displayName:"LiteLLM",api:"openai-completions",baseURL:url,apiKeyEnv:"LITELLM_API_KEY",models}}}};
              const wanted=(process.env.LITELLM_DEFAULT_MODEL||"").trim();
              const chosen=models.some(m=>m.id===wanted)?wanted:models[0].id;
              const def={id:"agent-default-model",name:"@deepseek-ai/dsh-agent-default-model",config:{provider:"litellm",model:chosen}};
              extra="\n- "+JSON.stringify(entry)+"\n- "+JSON.stringify(def)+"\n";
              console.log("litellm: "+models.length+" Modelle eingebunden: "+models.map(m=>m.id).join(", "));
              console.log("litellm: Standardmodell "+chosen);
            }catch(e){console.error("litellm: uebersprungen ("+e.message+")");}
          }
          fs.writeFileSync("/tmp/dsh.patch.yml",base+extra);
        })();
        '
        exec /usr/local/bin/deepseek-harness-entrypoint web --patch /tmp/dsh.patch.yml --no-open --trusted-host $$HOSTS
    environment:
      DSH_TELEMETRY_DISABLED: "1"
      DSH_DESKTOP_ENABLED: "${DSH_DESKTOP_ENABLED:-0}"
      HOME: /workspace
      LITELLM_URL: ${LITELLM_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_DEFAULT_MODEL: ${LITELLM_DEFAULT_MODEL:-}
    volumes:
      - dsh-home:/home/node/.dsh
      - ${DSH_WORKSPACE:-dsh-workspace}:/workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    shm_size: "1gb"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "${DSH_CPUS:-2}"
          memory: ${DSH_MEMORY:-4g}
          pids: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dsh-home:
  dsh-workspace:
