name: dsh

services:

  dsh-init:
    image: ghcr.io/obrige/dsh-docker:${DSH_IMAGE_TAG:-latest}
    pull_policy: always
    user: "0:0"
    entrypoint: ["sh", "-c", "find /data /workspace -xdev -not -user 1000 -exec chown 1000:1000 {} +"]
    network_mode: none
    restart: "no"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ${DSH_DATA:-dsh-data}:/data
      - ${DSH_WORKSPACE:-dsh-workspace}:/workspace

  dsh:
    image: ghcr.io/obrige/dsh-docker:${DSH_IMAGE_TAG:-latest}
    container_name: dsh
    restart: unless-stopped
    init: true
    user: "1000:1000"
    stop_grace_period: 30s
    depends_on:
      dsh-init:
        condition: service_completed_successfully
    ports:
      - ${DSH_BIND:-127.0.0.1}:${DSH_PORT:-3080}:3080
    volumes:
      - ${DSH_DATA:-dsh-data}:/data
      - ${DSH_WORKSPACE:-dsh-workspace}:/workspace
    environment:
      DSH_HOME: /data
      HOME: /home/node
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "${DSH_CPUS:-2}"
          memory: ${DSH_MEMORY:-4g}
          pids: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dsh-data:
  dsh-workspace:
