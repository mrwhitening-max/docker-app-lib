services:
  docker-in-docker:
    image: docker:dind
    container_name: docker_dind
    privileged: true
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
    healthcheck:
      test: ["CMD", "docker", "-H", "tcp://localhost:2375", "info"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  runner:
    image: data.forgejo.org/forgejo/runner:13
    container_name: runner
    depends_on:
      docker-in-docker:
        condition: service_healthy
    user: "1001:1001"
    environment:
      DOCKER_HOST: tcp://docker-in-docker:2375
    volumes:
      - ./data/runner:/data
    working_dir: /data
    configs:
      - source: runner-config
        target: /etc/forgejo-runner/config.yml
    command: ["forgejo-runner", "daemon", "--config", "/etc/forgejo-runner/config.yml"]
    restart: unless-stopped

configs:
  runner-config:
    content: |
      log:
        level: info
      runner:
        capacity: 1
        timeout: 3h
        labels:
          - "ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-22.04"
          - "ubuntu-22.04:docker://ghcr.io/catthehacker/ubuntu:act-22.04"
      cache:
        enabled: true
        dir: /data/.cache
      container:
        network: ""
        privileged: false
        docker_host: tcp://docker-in-docker:2375
      server:
        connections:
          forgejo:
            url: ${FORGEJO_URL:?FORGEJO_URL fehlt}
            uuid: ${RUNNER_UUID:?RUNNER_UUID fehlt}
            token: ${RUNNER_TOKEN:?RUNNER_TOKEN fehlt}
