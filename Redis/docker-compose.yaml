version: '3.8'

services:
  consul-agent:
    image: hashicorp/consul:${CONSUL_VERSION:-1.22.3}
    container_name: consul-agent
    hostname: ${CONSUL_NODE_NAME:-redis-agent}
    restart: unless-stopped
    network_mode: host
    volumes:
      - consul-data:/consul/data
    environment:
      - CONSUL_CA_CERT_B64=${CONSUL_CA_CERT_B64}
    configs:
      - source: consul_config
        target: /consul/config/consul.hcl
      - source: redis_service
        target: /consul/config/redis-service.hcl
    entrypoint: |
      sh -c '
        mkdir -p /consul/certs
        echo "$$CONSUL_CA_CERT_B64" | base64 -d > /consul/certs/consul-agent-ca.pem
        exec consul agent -config-dir=/consul/config/ -retry-join=${CONSUL_SERVER_IP}
      '

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    network_mode: host
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"

  envoy-sidecar:
    image: debian:bookworm-slim
    container_name: envoy-sidecar
    restart: unless-stopped
    network_mode: host
    volumes:
      - envoy-bin:/envoy-bin
    environment:
      - CONSUL_HTTP_ADDR=localhost:8500
      - REDIS_SERVICE_NAME=${REDIS_SERVICE_NAME:-redis}
    command: |
      sh -c '
        set -e
        apt-get update -qq && apt-get install -y -qq wget curl ca-certificates unzip
        if [ ! -f /envoy-bin/envoy ]; then
          wget -q -O /tmp/consul.zip https://releases.hashicorp.com/consul/${CONSUL_VERSION:-1.22.3}/consul_${CONSUL_VERSION:-1.22.3}_linux_amd64.zip
          unzip -o /tmp/consul.zip -d /envoy-bin/
          wget -q -O /envoy-bin/envoy https://github.com/envoyproxy/envoy/releases/download/v1.33.1/envoy-1.33.1-linux-x86_64
          chmod +x /envoy-bin/consul /envoy-bin/envoy
          rm -f /tmp/consul.zip
        fi
        export PATH="/envoy-bin:$$PATH"
        until curl -sf http://localhost:8500/v1/status/leader | grep -q ":8300"; do sleep 2; done
        exec consul connect envoy -sidecar-for $$REDIS_SERVICE_NAME -ignore-envoy-compatibility
      '
    depends_on:
      - consul-agent
      - redis

volumes:
  consul-data:
  redis-data:
  envoy-bin:

configs:
  consul_config:
    content: |
      datacenter    = "${CONSUL_DATACENTER:-homelab}"
      data_dir      = "/consul/data"
      server        = false
      log_level     = "${CONSUL_LOG_LEVEL:-INFO}"
      client_addr   = "0.0.0.0"
      bind_addr      = "{{ GetInterfaceIP \"eth0\" }}"
      advertise_addr = "{{ GetInterfaceIP \"eth0\" }}"
      encrypt                 = "${CONSUL_GOSSIP_KEY}"
      encrypt_verify_incoming = true
      encrypt_verify_outgoing = true
      tls {
        defaults {
          ca_file         = "/consul/certs/consul-agent-ca.pem"
          verify_outgoing = true
        }
        internal_rpc {
          verify_server_hostname = true
        }
      }
      auto_encrypt { tls = true }
      connect { enabled = true }
      ports { grpc = 8502 }
      telemetry {
        prometheus_retention_time = "30s"
        disable_hostname          = false
      }

  redis_service:
    content: |
      service {
        name = "${REDIS_SERVICE_NAME:-redis}"
        port = 6379
        tags = ["cache", "memory", "agents"]
        connect {
          sidecar_service {
            proxy {}
          }
        }
        check {
          tcp      = "127.0.0.1:6379"
          interval = "15s"
          timeout  = "3s"
        }
      }